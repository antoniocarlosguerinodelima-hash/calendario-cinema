name: Atualizar calendário de cinema
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: python -m pip install requests beautifulsoup4
      - name: Atualizar estreias
        run: python atualizar.py
      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cinema_Estreias_UCI_Cinemark_Identificados.ics
          if ! git diff --cached --quiet; then
            git commit -m "Atualização automática das estreias"
            git push
          else
            echo "Nenhuma mudança."
          fi
